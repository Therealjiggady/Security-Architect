name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Trigger Render deployment
      run: |
        echo "Render auto-deploys on push to develop branch"
        echo "Check your Render dashboard for deployment status"
    
    - name: Wait for deployment
      run: sleep 60
    
    - name: Health check
      run: |
        curl --fail https://broke-beauty-staging.onrender.com/health || echo "Backend not ready yet"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Vercel
      run: |
        echo "Vercel auto-deploys on push"
        echo "Or use: npx vercel --prod --token=$VERCEL_TOKEN"
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
    - name: Deployment status
      run: |
        echo "Staging deployment complete!"
        echo "Backend: https://broke-beauty-staging.onrender.com"
        echo "Frontend: https://broke-beauty-staging.vercel.app"
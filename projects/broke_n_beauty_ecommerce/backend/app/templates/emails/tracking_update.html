<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2196F3; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .tracking-info { background-color: white; padding: 15px; border-left: 4px solid #2196F3; margin: 15px 0; }
        .button { display: inline-block; padding: 12px 24px; background-color: #2196F3; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Order Update</h1>
        </div>
        <div class="content">
            <h2>Your Order #{{ order_id }} Status: {{ status }}</h2>
            <div class="tracking-info">
                <p><strong>Tracking Number:</strong> {{ tracking_number }}</p>
                <p><strong>Carrier:</strong> {{ carrier }}</p>
                <p><strong>Status:</strong> {{ status }}</p>
            </div>
            <a href="{{ tracking_url }}" class="button">Track Your Package</a>
        </div>
        <div class="footer">
            <p>Broken Beauty Activewear</p>
        </div>
    </div>
</body>
</html>

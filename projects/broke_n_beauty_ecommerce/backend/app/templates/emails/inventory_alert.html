<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .button { display: inline-block; padding: 12px 24px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Great News!</h1>
        </div>
        <div class="content">
            <h2>{{ product_name }} is Back in Stock!</h2>
            <p><strong>Variant:</strong> {{ variant_info }}</p>
            <p>The item you've been waiting for is now available. Don't miss out - stock is limited!</p>
            <a href="{{ product_url }}" class="button">Shop Now</a>
        </div>
        <div class="footer">
            <p>You're receiving this because you signed up for inventory alerts.</p>
            <p>Broken Beauty Activewear</p>
        </div>
    </div>
</body>
</html>

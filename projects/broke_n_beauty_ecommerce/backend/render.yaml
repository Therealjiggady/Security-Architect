services:
  # FastAPI Backend Service
  - type: web
    name: broke-beauty-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: broke-beauty-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://broke-beauty.vercel.app

databases:
  # PostgreSQL Database
  - name: broke-beauty-db
    databaseName: brokenbeauty
    user: brokenbeauty
    plan: free
    region: oregon
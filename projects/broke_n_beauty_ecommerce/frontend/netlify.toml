[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[context.production]
  environment = { VITE_API_URL = "https://broke-beauty-api.onrender.com" }

[context.deploy-preview]
  environment = { VITE_API_URL = "https://broke-beauty-staging.onrender.com" }

[context.branch-deploy]
  environment = { VITE_API_URL = "https://broke-beauty-staging.onrender.com" }